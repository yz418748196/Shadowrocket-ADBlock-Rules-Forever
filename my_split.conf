Spotify = select,PROXY,DIRECT,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Telegram = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Twitter = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Facebook = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
PayPal = select,PROXY,DIRECT,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Amazon = select,PROXY,DIRECT,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
苹果服务 = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
谷歌服务 = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
微软服务 = select,PROXY,DIRECT,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
