# 本地手动分组模板：首次复制到扩展配置，日常只更新 lazy_rules.conf。
# 不要给这个本地扩展添加 update-url，也不要用远程模板覆盖已保存的选择。
[General]
include = lazy_rules.conf

[Proxy Group]
# 所有分组默认手动选择；从小火箭首页下拉设置地区和具体节点。
# 模板不预填 policy-select-name；小火箭保存手动选择时自行写入的值可以保留。
AI = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
特殊需求 = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
YouTube = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Netflix = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Disney+ = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Max = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
