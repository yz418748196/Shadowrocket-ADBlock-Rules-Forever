# 本地手动分组模板：首次复制到扩展配置，日常只更新 lazy_rules.conf。
# 不要给这个本地扩展添加 update-url，也不要用远程模板覆盖已保存的选择。
[General]
include = lazy_rules.conf

[Proxy Group]
# 所有分组默认手动选择；从小火箭首页下拉设置地区、机场、具体节点。
# 模板不预填 policy-select-name；小火箭保存手动选择时自行写入的值可以保留。
AI = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
特殊需求 = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
YouTube = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Netflix = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Disney+ = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Max = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
TikTok = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Spotify = select,PROXY,DIRECT,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Telegram = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Twitter = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Facebook = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
PayPal = select,PROXY,DIRECT,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
Amazon = select,PROXY,DIRECT,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
苹果服务 = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
谷歌服务 = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
微软服务 = select,PROXY,DIRECT,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点
哔哩哔哩 = select,DIRECT,PROXY,香港节点,台湾节点
游戏平台 = select,PROXY,DIRECT,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点

香港节点 = select,香港节点-KTM,香港节点-魔戒
台湾节点 = select,台湾节点-KTM,台湾节点-魔戒
日本节点 = select,日本节点-KTM,日本节点-魔戒
新加坡节点 = select,新加坡节点-KTM,新加坡节点-魔戒
韩国节点 = select,韩国节点-KTM,韩国节点-魔戒
美国节点 = select,美国节点-KTM,美国节点-魔戒

# 机场节点手动选择；use=true 只用于限定订阅来源。
# 每组只启用一行。恢复自动：注释 select 行，再取消对应 url-test 行前的 #。
香港节点-KTM = select,KTM,use=true,policy-regex-filter=🇭🇰|香港|Hong\ Kong|HongKong
# 香港节点-KTM = url-test,KTM,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=🇭🇰|香港|Hong\ Kong|HongKong

香港节点-魔戒 = select,魔戒,use=true,policy-regex-filter=🇭🇰|香港|Hong\ Kong|HongKong
# 香港节点-魔戒 = url-test,魔戒,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=🇭🇰|香港|Hong\ Kong|HongKong

台湾节点-KTM = select,KTM,use=true,policy-regex-filter=🇹🇼|台湾|台灣|台北|台中|新北|彰化|Taiwan|Taipei
# 台湾节点-KTM = url-test,KTM,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=🇹🇼|台湾|台灣|台北|台中|新北|彰化|Taiwan|Taipei

台湾节点-魔戒 = select,魔戒,use=true,policy-regex-filter=🇹🇼|台湾|台灣|台北|台中|新北|彰化|Taiwan|Taipei
# 台湾节点-魔戒 = url-test,魔戒,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=🇹🇼|台湾|台灣|台北|台中|新北|彰化|Taiwan|Taipei

日本节点-KTM = select,KTM,use=true,policy-regex-filter=🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka
# 日本节点-KTM = url-test,KTM,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka

日本节点-魔戒 = select,魔戒,use=true,policy-regex-filter=🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka
# 日本节点-魔戒 = url-test,魔戒,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka

新加坡节点-KTM = select,KTM,use=true,policy-regex-filter=🇸🇬|新加坡|狮城|獅城|Singapore
# 新加坡节点-KTM = url-test,KTM,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=🇸🇬|新加坡|狮城|獅城|Singapore

新加坡节点-魔戒 = select,魔戒,use=true,policy-regex-filter=🇸🇬|新加坡|狮城|獅城|Singapore
# 新加坡节点-魔戒 = url-test,魔戒,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=🇸🇬|新加坡|狮城|獅城|Singapore

韩国节点-KTM = select,KTM,use=true,policy-regex-filter=🇰🇷|韩国|韓國|首尔|首爾|Korea|Seoul
# 韩国节点-KTM = url-test,KTM,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=🇰🇷|韩国|韓國|首尔|首爾|Korea|Seoul

韩国节点-魔戒 = select,魔戒,use=true,policy-regex-filter=🇰🇷|韩国|韓國|首尔|首爾|Korea|Seoul
# 韩国节点-魔戒 = url-test,魔戒,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=0,timeout=5,select=0,policy-regex-filter=🇰🇷|韩国|韓國|首尔|首爾|Korea|Seoul

美国节点-KTM = select,KTM,use=true,policy-regex-filter=🇺🇸|美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|United\ States
