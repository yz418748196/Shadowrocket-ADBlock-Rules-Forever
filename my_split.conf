# 六个地区直接筛选 KTM 订阅节点，手动选择具体节点。
香港节点 = select,KTM,use=true,policy-regex-filter=🇭🇰|香港|Hong\ Kong|HongKong
台湾节点 = select,KTM,use=true,policy-regex-filter=🇹🇼|台湾|台灣|台北|台中|新北|彰化|Taiwan|Taipei
日本节点 = select,KTM,use=true,policy-regex-filter=🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka
新加坡节点 = select,KTM,use=true,policy-regex-filter=🇸🇬|新加坡|狮城|獅城|Singapore
韩国节点 = select,KTM,use=true,policy-regex-filter=🇰🇷|韩国|韓國|首尔|首爾|Korea|Seoul
美国节点 = select,KTM,use=true,policy-regex-filter=🇺🇸|美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|United\ States
